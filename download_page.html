<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل نظام إدارة الاستيراد والجمارك — IMS ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 540px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .icon-box {
            margin-bottom: 20px;
        }
        .icon-img {
            width: 110px;
            height: 110px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.2);
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 18px;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.4);
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(2, 132, 199, 0.6);
            background: linear-gradient(135deg, #0369a1 0%, #0284c7 100%);
        }
        .meta {
            margin-top: 24px;
            font-size: 13px;
            color: #64748b;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 18px;
        }
        .version-badge {
            color: #38ef7d;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-box">
            <img src="https://shipping.baraa-solutions.com/updates/app_icon.png" alt="IMS Logo" class="icon-img" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><text x=\'20\' y=\'65\' font-size=\'60\'>🚢</text></svg>';">
        </div>
        <h1>نظام إدارة الاستيراد والجمارك (IMS)</h1>
        <p>النسخة الرسمية المعتمدة لسطح المكتب (Windows Standalone Executable). تشمل حاسبة CBM، التقدير الجمركي، وإدارة الشحنات المرجعية.</p>
        
        <a href="IMS.exe" class="btn-download">
            📥 تحميل برنامج IMS المباشر (Direct Download IMS.exe)
        </a>

        <div class="meta">
            <span>💻 نظام التشغيل: Windows 10 / 11</span>
            <span class="version-badge" id="app-version">⚡ الإصدار: v1.0.1</span>
        </div>
    </div>

    <!-- Automated Live Version Fetch & Sync -->
    <script>
        fetch('version.json?cache=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                if (data.latest_version) {
                    document.getElementById('app-version').innerText = '⚡ الإصدار: v' + data.latest_version;
                }
            })
            .catch(err => console.log('Version sync:', err));
    </script>
</body>
</html>
