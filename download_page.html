<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل نظام إدارة الاستيراد والجمارك — Import ERP System</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 540px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 18px;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.4);
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(2, 132, 199, 0.6);
            background: linear-gradient(135deg, #0369a1 0%, #0284c7 100%);
        }
        .meta {
            margin-top: 24px;
            font-size: 13px;
            color: #64748b;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 18px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🚢</div>
        <h1>نظام إدارة الاستيراد والجمارك</h1>
        <p>النسخة الرسمية المعتمدة لسطح المكتب (Windows Executable). تشمل حاسبة CBM، التقدير الجمركي، وإدارة الشحنات المرجعية.</p>
        
        <a href="ims.exe" class="btn-download">
            📥 تحميل برنامج IMS المباشر (Direct Download ims.exe)
        </a>

        <div class="meta">
            <span>💻 نظام التشغيل: Windows 10 / 11</span>
            <span>⚡ الإصدار: v1.0.0</span>
        </div>
    </div>
</body>
</html>
